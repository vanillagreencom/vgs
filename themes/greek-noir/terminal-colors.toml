# Terminal-only ANSI slots: the diff colours a terminal paints, where the
# palette's own red and green collide in hue, are too grey, or are too dark
# on the background. The shell's derived roles, pi and every other app
# template keep the palette's slots.

# red: removed lines in a diff.
color1 = "#d9544b"

# green: added lines in a diff.
color2 = "#3dad1b"

# bright red: removed words in a diff.
color9 = "#d9544b"

# bright green: added words in a diff.
color10 = "#3dad1b"
