# The vgs theme for foot, included from foot.ini by vgsh theme apply.
# Both sections hold the theme, so foot's light and dark modes draw it alike.
[colors-dark]
foreground=@{palette.foreground}
background=@{palette.background}
selection-foreground=@{palette.foreground}
selection-background=@{color.borderStrong}
urls=@{palette.accent}
regular0=@{terminal.color0}
regular1=@{terminal.color1}
regular2=@{terminal.color2}
regular3=@{terminal.color3}
regular4=@{terminal.color4}
regular5=@{terminal.color5}
regular6=@{terminal.color6}
regular7=@{terminal.color7}
bright0=@{terminal.color8}
bright1=@{terminal.color9}
bright2=@{terminal.color10}
bright3=@{terminal.color11}
bright4=@{terminal.color12}
bright5=@{terminal.color13}
bright6=@{terminal.color14}
bright7=@{terminal.color15}

[colors-light]
foreground=@{palette.foreground}
background=@{palette.background}
selection-foreground=@{palette.foreground}
selection-background=@{color.borderStrong}
urls=@{palette.accent}
regular0=@{terminal.color0}
regular1=@{terminal.color1}
regular2=@{terminal.color2}
regular3=@{terminal.color3}
regular4=@{terminal.color4}
regular5=@{terminal.color5}
regular6=@{terminal.color6}
regular7=@{terminal.color7}
bright0=@{terminal.color8}
bright1=@{terminal.color9}
bright2=@{terminal.color10}
bright3=@{terminal.color11}
bright4=@{terminal.color12}
bright5=@{terminal.color13}
bright6=@{terminal.color14}
bright7=@{terminal.color15}
