; The vgs colour scheme for qt6ct, linked into qt6ct/colors/ as vgs.conf by
; vgsh theme apply. One colour per QPalette role, in role order: WindowText,
; Button, Light, Midlight, Dark, Mid, Text, BrightText, ButtonText, Base,
; Window, Shadow, Highlight, HighlightedText, Link, LinkVisited,
; AlternateBase, NoRole, ToolTipBase, ToolTipText, PlaceholderText.
[ColorScheme]
active_colors=#@{color.text}, #@{color.surfaceRaised}, #@{color.surfaceHover}, #@{color.borderSubtle}, #@{color.border}, #@{color.borderStrong}, #@{color.text}, #@{color.onAccent}, #@{color.text}, #@{color.background}, #@{color.surface}, #@{palette.background}, #@{color.accent}, #@{color.onAccent}, #@{color.info}, #@{color.accent}, #@{color.surface}, #@{color.surface}, #@{color.surfaceRaised}, #@{color.text}, #@{color.textFaint}
inactive_colors=#@{color.text}, #@{color.surfaceRaised}, #@{color.surfaceHover}, #@{color.borderSubtle}, #@{color.border}, #@{color.borderStrong}, #@{color.text}, #@{color.onAccent}, #@{color.text}, #@{color.background}, #@{color.surface}, #@{palette.background}, #@{color.accent}, #@{color.onAccent}, #@{color.info}, #@{color.accent}, #@{color.surface}, #@{color.surface}, #@{color.surfaceRaised}, #@{color.text}, #@{color.textFaint}
disabled_colors=#@{color.textDisabled}, #@{color.surfaceRaised}, #@{color.surfaceHover}, #@{color.borderSubtle}, #@{color.border}, #@{color.borderStrong}, #@{color.textDisabled}, #@{color.textDisabled}, #@{color.textDisabled}, #@{color.background}, #@{color.surface}, #@{palette.background}, #@{color.borderStrong}, #@{color.textDisabled}, #@{color.textDisabled}, #@{color.textDisabled}, #@{color.surface}, #@{color.surface}, #@{color.surfaceRaised}, #@{color.textDisabled}, #@{color.textDisabled}
