# The vgs theme for Hyprland, sourced from hyprland.conf by vgsh theme apply.
# Each $vgs_ variable is a theme colour your own settings can name. The
# borders and the group bar below take them; a setting of yours after the
# source line overrides it.
$vgs_background = @{palette.background}
$vgs_foreground = @{palette.foreground}
$vgs_accent = @{palette.accent}
$vgs_on_accent = @{color.onAccent}
$vgs_success = @{palette.success}
$vgs_warning = @{palette.warning}
$vgs_on_warning = @{color.onWarning}
$vgs_danger = @{palette.danger}
$vgs_info = @{palette.info}
$vgs_surface = @{color.surfaceRaised}
$vgs_border = @{color.border}
$vgs_border_subtle = @{color.borderSubtle}
$vgs_text = @{color.text}

general {
    col.active_border = $vgs_accent
    col.inactive_border = $vgs_border
    col.nogroup_border_active = $vgs_accent
    col.nogroup_border = $vgs_border_subtle
}

group {
    col.border_active = $vgs_accent
    col.border_inactive = $vgs_border
    col.border_locked_active = $vgs_warning
    col.border_locked_inactive = $vgs_border

    groupbar {
        col.active = $vgs_accent
        col.inactive = $vgs_surface
        col.locked_active = $vgs_warning
        col.locked_inactive = $vgs_surface
        text_color = $vgs_on_accent
        text_color_inactive = $vgs_text
        text_color_locked_active = $vgs_on_warning
        text_color_locked_inactive = $vgs_text
    }
}
