# The vgs lock screen for hyprlock, rendered by vgsh theme apply. `vgsh lock`
# runs hyprlock on this file with VGS_LOCK_BACKGROUND naming the theme's
# background image; hyprlang reads the variable from the environment, and an
# unset one leaves no image, so the background colour shows.
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $VGS_LOCK_BACKGROUND
    color = @{color.background}
}

# The scrim over the image, so the clock and the field read on any picture.
shape {
    monitor =
    size = 100%, 100%
    color = @{color.scrim}
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = @{color.textHeading}
    font_size = @{text.display.size}
    font_family = @{text.display.family}
    position = 0, @{space.xxxl}
    halign = center
    valign = center
}

input-field {
    monitor =
    size = @{size.panel.sm}, @{size.control.lg}
    outline_thickness = @{border.thick}
    rounding = @{textField.radius}
    outer_color = @{textField.borderColor}
    inner_color = @{textField.background}
    font_color = @{color.text}
    font_family = @{text.body.family}
    check_color = @{color.accent}
    fail_color = @{color.danger}
    capslock_color = @{color.warning}
    placeholder_text = Password
    fail_text = $PAMFAIL
    fade_on_empty = false
    position = 0, -@{space.xxxl}
    halign = center
    valign = center
}
