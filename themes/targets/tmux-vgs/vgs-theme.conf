# Auto-generated by VGS - VGS tmux colors.
set -gu window-style
set -g status-style "bg={statusBg},fg={statusFg}"
set -g message-style "bg={secondary},fg={onSecondary},bold"
set -g message-command-style "bg={secondary},fg={onSecondary},bold"
set -g pane-border-style "fg={outline}"
set -g pane-active-border-style "fg={accent}"
set -g window-active-style "fg={foreground}"
set -g mode-style "bg={selection_background},fg={selection_foreground}"
set -g copy-mode-selection-style "bg={selection_background},fg={selection_foreground}"
set -g clock-mode-colour "{statusError}"
set -g window-status-style "fg={statusMuted},bg={statusBg}"
set -g window-status-current-style "bg={accent},fg={onPrimary},bold"
set -g window-status-activity-style "fg={statusAccent},bold"
set -g window-status-bell-style "fg={statusError},bold"
set -g status-left-length 30
set -g status-right-length 80
set -g status-left "#{?client_prefix,#[fg={statusError}],#[fg={statusAccent}]} 󰊠 #[fg={statusFg}]#S "
set -g status-right "#(~/.local/bin/tmux-git-status #{pane_id})"
set -g window-status-format "#{?window_bell_flag,#[fg={statusFg}] #[fg={statusWarning}]#[underscore]#I: #W#[nounderscore]#[fg={statusFg}] #[default] ,#[fg={statusMuted}] #I: #[fg={statusFg}]#W #[default] }"
set -g window-status-current-format "#[bg={accent}#,fg={onPrimary}#,bold] #[fg={onPrimary}]#I: #W #[default] "
set -g window-status-separator ""
set -g status 2
set -g "status-format[1]" "#[fill=terminal]"
