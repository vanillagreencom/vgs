# The vgs theme for tmux, sourced from tmux.conf by vgsh theme apply.
# Every #{...} below is a tmux format, which the render leaves as it is.
set -g status-style "bg=#@{color.surface},fg=#@{color.text}"
set -g message-style "bg=#@{color.surfaceRaised},fg=#@{color.text}"
set -g message-command-style "bg=#@{color.surfaceRaised},fg=#@{palette.accent}"
set -g mode-style "bg=#@{color.borderStrong},fg=#@{palette.foreground}"
set -g pane-border-style "fg=#@{color.border}"
set -g pane-active-border-style "#{?pane_in_mode,fg=#@{palette.warning},#{?synchronize-panes,fg=#@{palette.danger},fg=#@{palette.accent}}}"
set -g pane-border-format "#{?pane_active,#[fg=#@{palette.accent}],#[fg=#@{color.textMuted}]}#{pane_index} #{pane_id}#[default] \"#{pane_title}\""
set -g window-status-style "bg=#@{color.surface},fg=#@{color.textMuted}"
set -g window-status-current-style "bg=#@{palette.accent},fg=#@{color.onAccent},bold"
set -g window-status-activity-style "fg=#@{palette.warning}"
set -g window-status-bell-style "fg=#@{palette.danger},bold"
set -g clock-mode-colour "#@{palette.accent}"
set -g display-panes-colour "#@{color.textMuted}"
set -g display-panes-active-colour "#@{palette.accent}"
