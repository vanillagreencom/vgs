name: CI

# One job, ci-ok, because branch protection requires that context. The
# steps that need a Wayland session run locally through scripts/validate;
# the runner has none, so `scripts/validate qml` is not here.

on:
  pull_request:
    branches: [main, v2]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, v2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: ci-ok
    runs-on: ${{ vars.CI_RUNNER_2V || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bot instructions
        run: .agents/skills/bot-instructions/scripts/bot-instructions check

      - name: Document limits
        run: .agents/skills/doc-limits/scripts/doc-limits

      - name: Commit guards
        run: .agents/skills/commit-guards/scripts/commit-guards all --base "origin/${{ github.base_ref || github.event.repository.default_branch }}"

      - name: Whitespace errors introduced by this change
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            merge_group) base="HEAD^1" ;;
            push) base="$PUSH_BEFORE" ;;
            *) echo "::error::no whitespace base for event $EVENT_NAME"; exit 1 ;;
          esac
          if [ -z "$base" ] || ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            echo "::error::cannot resolve the whitespace base '$base' for event $EVENT_NAME; nothing was checked"
            exit 1
          fi
          git diff --check "$base...HEAD"

      - name: Plugin logic
        run: scripts/validate logic
      - name: Manifests
        run: scripts/validate manifests
      - name: Plugin boundary
        run: scripts/validate boundary
      - name: Measurement tools
        run: scripts/validate tools
