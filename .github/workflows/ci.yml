name: CI

# One job, ci-ok, because branch protection requires that context. CI runs
# `scripts/validate offline`, every check but the nested smoke, plus the
# kendex guards; `scripts/validate qml` needs a Wayland session the runner
# has none of and runs locally. A step that runs a script the tree does not
# hold is a defect. Every check that compares against a base takes the
# change's own base: the pull request's base branch, the merge group's base
# commit, or the ref a push moved from; never a fixed branch name.

on:
  pull_request:
    branches: [main, v2]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, v2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: ci-ok
    runs-on: ${{ vars.CI_RUNNER_2V || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bot instructions
        run: .agents/skills/bot-instructions/scripts/bot-instructions check

      - name: Document limits
        run: .agents/skills/doc-limits/scripts/doc-limits

      - name: Change base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="origin/$PR_BASE_REF" ;;
            merge_group) base="$MERGE_GROUP_BASE_SHA" ;;
            push) base="$PUSH_BEFORE" ;;
            *) echo "::error::no change base for event $EVENT_NAME"; exit 1 ;;
          esac
          if [ -z "$base" ] || ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            echo "::error::cannot resolve the change base '$base' for event $EVENT_NAME; nothing was checked"
            exit 1
          fi
          echo "VGS_VALIDATE_BASE=$base" >>"$GITHUB_ENV"

      - name: Commit guards
        run: .agents/skills/commit-guards/scripts/commit-guards all --base "$VGS_VALIDATE_BASE"

      - name: Validation manifest, offline rows
        run: scripts/validate offline
