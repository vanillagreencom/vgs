name: CI

# Runs the scripts/validate manifest on every pull request as individual named
# steps, never by invoking the runner. Before this workflow the only checks on a
# VGS PR were CodeQL default-setup Analyze jobs, which say nothing about VGS's
# own suite — how `check-validation-safety.sh` sat red on clean main (VGS-18).
#
# ONE JOB, DELIBERATELY, on the 2 vCPU runner (shared CI_RUNNER_2V repository
# variable; Blacksmith when set, `ubuntu-latest` when unset — that fallback is
# supported and must keep working). The suite is ~30s of total compute, so
# per-job overhead dominates: no lanes, no change-detection gate, no
# ci-nightly.yml, and the bigger runner tiers buy nothing. Measured figures and
# re-measure commands: docs/decisions/D007-ci-single-job-economics.md.
#
# One job also means one stable required check. Point branch protection and the
# merge queue at `CI / ci-ok` — the job is NAMED for the required context
# rather than for what it does, which is the indirection a separate aggregator
# job would have bought: if lanes are ever added, the real work moves to new
# jobs and `ci-ok` becomes the aggregator over them, and branch protection
# keeps requiring the same context.

on:
  # Deliberately NO pull_request_review / pull_request_review_comment triggers.
  # They mint a second run on the same head that the concurrency group then
  # cancels; hyprtrade measured 37 of 43 cancellations across 100 runs coming
  # from exactly those two triggers, and a cancelled required check on the
  # current head blocks merge-queue enqueue.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Required checks must exist on merge-group shas too, or a queue entry blocks
  # forever waiting on a context nothing creates (vstack VST-10).
  merge_group:
    types: [checks_requested]
  # Post-merge signal on main. The absence of exactly this is how a permanently
  # red check survived on main unnoticed (VGS-18). Cheap here because the job
  # caches nothing and takes minutes-at-worst.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Per-PR on pull_request; push/merge_group fall back to the ref.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # ONLY pull_request cancels. A synchronize means a new head sha, so the
  # cancelled check-runs land on the superseded sha, which the merge queue
  # ignores. Nothing may cancel a run on the CURRENT head — the queue counts
  # every check-run on the head, and a cancelled required check there blocks
  # enqueue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # THE ONE-JOB RULE HAS ONE DELIBERATE EXCEPTION, structural rather than
  # economic (VGS-41/v2 cutover, the vstack review-gate engine):
  #
  #   review-gate-selftest
  #                    must be UNGATED and separate: a broken predicate
  #                    approves nothing, so a selftest sharing a job with
  #                    gated work could never run when it matters.
  #
  # The old second exception — an in-CI `review-gate` job that evaluated the
  # predicate and posted the gate status — is gone with the v1 machinery: the
  # v2 single writer (.github/workflows/review-gate-writer.yml) is the ONLY
  # writer of the gate status, runs the default-branch engine on every leg,
  # and replaced that job plus approval-rerun.yml and approval-sweep.yml.
  #
  # `ci-ok` deliberately takes no gate condition and no fast/full split. The
  # engine's recommended split holds heavy jobs to the merge queue, which
  # pays off when suites run for minutes; VGS's whole suite is ~30s, so every
  # job simply runs on every leg (the adoption precondition's "no held-back
  # jobs" arm — satisfied here in addition to the merge queue). The gate
  # blocks the MERGE via its status; it is not here to save compute VGS does
  # not spend.
  review-gate-selftest:
    name: Review gate selftest
    # DELIBERATELY UNGATED: no `needs`, no approval condition, no path filter.
    # A broken predicate approves nothing, so a gated selftest could never run
    # when it matters. Failing here reds the build without stopping the writer
    # workflow from posting — a PR with no gate status at all is stuck, not
    # blocked.
    #
    # UNGATED IS NOT THE SAME AS NON-BLOCKING, and conflating the two left a
    # real hole: this job is not a required context, and the writer evaluates
    # the DEFAULT-BRANCH predicate, so the gate stays green on a PR that
    # breaks the head's predicate. A change breaking review-predicate.sh could
    # merge with its own selftest red. `ci-ok` therefore takes `needs:` on
    # this job (below), which makes it blocking without gating it — the
    # selftest still runs first, on every event, and hands out no write token,
    # since it holds only `contents: read`.
    runs-on: ${{ vars.CI_RUNNER_2V || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Run from the repo root so the configured layer re-derives its cases
      # from VGS's own REVIEW_GATE_* values, not the engine's defaults.
      - name: Pin the review-gate decision table
        run: third_party/review-gate/scripts/review-predicate-selftest.sh
      - name: pr-watch behavioral suite (offline, stubbed gh)
        run: bash third_party/review-gate/tests/pr-watch.test.sh
      # Runs the writer template's step scripts AND this repo's adopted
      # .github/workflows/review-gate-writer.yml. Unwired, the adopted copy
      # could drift off the relay/converge topology (VST-210) while every
      # green check kept saying otherwise — the gate's own workflow is the
      # one file no other check reads.
      - name: Writer template and adopted-workflow suite (offline, stubbed gh)
        run: bash third_party/review-gate/tests/review-writer-template.test.sh
      - name: review-writer behavioral suite (offline, stubbed gh)
        run: bash third_party/review-gate/tests/review-writer.test.sh

  validate:
    # The required-check context is `CI / ci-ok`; see the aggregator note above.
    name: ci-ok
    # The ONE `needs` here, and it is about blocking rather than sequencing:
    # `ci-ok` is the required context, so depending on the selftest is what
    # makes a broken review predicate unable to merge. It does not gate the
    # selftest on anything, and it costs no token — the selftest is
    # `contents: read` only. The gate job is deliberately NOT a dependency:
    # that one holds `statuses: write`, and `ci-ok` must never wait on a
    # write-capable job, nor delay the author's first signal on review state.
    needs: review-gate-selftest
    runs-on: ${{ vars.CI_RUNNER_2V || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The whitespace check below diffs against the pull request base.
          fetch-depth: 0
          persist-credentials: false

      # Cheapest checks first, so the common failures report in seconds rather
      # than after the Go toolchain and the Qt install.
      - name: Naming guard
        run: scripts/check-naming.sh

      # Asserts this workflow and the scripts/validate manifest still name the
      # same checks. Four checks under scripts/ were committed and invoked by nothing
      # at all before this existed (VGS-50).
      - name: Validation inventory
        run: scripts/check-validation-inventory.py

      # Byte ceilings on always-loaded instruction surfaces and
      # docs/architecture/*.md. AGENTS.md grew 3.3x in 14 days before the
      # VGS-107 diet; regrowth past a ceiling must be a same-PR ceiling edit
      # with a rationale, not drift (VGS-108).
      - name: Instruction-surface growth ratchet
        run: scripts/check-doc-growth.py

      # Tighten-only line-count gate over every tracked file: offenders are
      # frozen in tools/size-ratchet-baseline.tsv and may only shrink; new
      # files stay under SIZE_RATCHET_THRESHOLD (vstack.settings.toml). The
      # engine is the vendored vstack copy — CI has no .agents/ mirror — and
      # scripts/check-size-ratchet-vendor.sh (local-only) keeps the two copies
      # identical (VGS-111).
      - name: File-size ratchet
        run: third_party/size-ratchet/scripts/size-ratchet

      # The engine's own behavioral suites, same rationale as the review-gate
      # selftest: CI proving only "today's tree passes the gate" would let a
      # future re-vendor weaken a failure direction (new-offender, growth,
      # malformed-config, --update tighten-only, collection fail-closed)
      # while byte-identity keeps looking clean. Every suite ships with the
      # vendored engine and runs offline.
      - name: size-ratchet behavioral suites (offline)
        run: |
          for t in third_party/size-ratchet/tests/*.test.sh; do
            echo "== $t"
            bash "$t"
          done

      # scripts/validate lists a bare `git diff --check`, which is a working-tree
      # check: on a clean CI checkout it inspects nothing at all. The form that
      # means something is a range of what the event actually introduces.
      #
      # UNCONDITIONAL ON PURPOSE. This step used to carry
      # `if: github.event_name == 'pull_request'`, which left it silently
      # skipped on merge_group and main push — green without checking, on
      # exactly the two events that gate landing code. A usable range exists for
      # all three events, so there is no reason to skip any of them.
      #
      # A whole-tree check is NOT the alternative: the tree's pre-existing
      # findings all sit in content VGS ships verbatim, so it would be red from
      # day one. Figures and derivation:
      # docs/decisions/D007-ci-single-job-economics.md.
      #
      # The step fails rather than checking a substitute range when its base
      # cannot be resolved; see the comment on the fallback inside the script.
      - name: Whitespace errors introduced by this change
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # THERE IS NO FALLBACK BASE, DELIBERATELY. An earlier revision
          # substituted HEAD^1 whenever the intended base would not resolve.
          # That turned an unverifiable range into a PASS over a narrower one —
          # green while claiming coverage it did not have, which is the same
          # defect as the skipped step this check replaced, one layer down.
          # Each event names exactly one base, and if that base cannot be
          # resolved the step fails.
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              source="the pull request base"
              ;;
            # HEAD is the merge commit the queue built, so its first parent is
            # the queue base and the range is everything the group adds —
            # including a combination of several PRs that no single PR's own
            # range ever covered.
            merge_group)
              base="HEAD^1"
              source="the merge commit's first parent"
              ;;
            push)
              base="$PUSH_BEFORE"
              source="the previous tip of the branch"
              ;;
            # Fail closed rather than guessing: adding a trigger must be a
            # conscious decision about what this check compares against.
            *)
              echo "::error::whitespace check has no defined base for event $EVENT_NAME; define one before adding that trigger"
              exit 1
              ;;
          esac
          # Unresolvable cases: a force-push can leave the previous tip
          # unreachable, a branch-creation push sends the all-zero sha, and a
          # root commit has no first parent. None of them can be papered over
          # with a different range — "did not check" must never read as
          # "checked", and a red run on a rewritten trunk is informative, not
          # noise.
          if [ -z "$base" ] || ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            echo "::error::cannot resolve $source ('$base') for event $EVENT_NAME, so the whitespace range is unknown and NOTHING was checked. Not falling back to a narrower range: that would pass while claiming coverage it does not have."
            exit 1
          fi
          echo "whitespace range: $base...HEAD ($source)"
          git diff --check "$base...HEAD"

      # check-aur-sync.py runs without --remote here on purpose: the offline
      # half (PKGBUILD vs .SRCINFO) is what a PR can break, and it says out
      # loud that it did not look at what the AUR publishes. Comparing against
      # aur.archlinux.org belongs to publish-aur.yml, which owns the push and
      # runs a weekly drift check; putting a network fetch on every PR would
      # make an unrelated PR red for an AUR-side problem it cannot fix.
      - name: Packaging metadata and assets
        run: |
          python3 scripts/lib/shell_scan.py
          python3 scripts/lib/qml_source_selftest.py
          scripts/gen-package-metadata.py
          scripts/check-package-assets.sh
          scripts/check-aur-sync.py

      # Every external command shipped code probes must be declared in
      # config/vshell/dependencies.json or excluded there with a reason, or
      # `vshell deps status` reports a healthy system while a feature is dead.
      - name: Probed-command declarations
        run: scripts/check-command-declarations.py

      - name: Settings migration
        run: |
          node --check scripts/check-settings-migration.js
          scripts/check-settings-migration.js

      - name: Queue, theme-request and plugin-policy regressions
        run: |
          scripts/test-restyle-queue.js
          scripts/test-theme-requests.js
          scripts/test-latest-transaction-queue.js
          scripts/test-bundled-override.js
          scripts/test-plugin-requirement-report.js
          scripts/test-toast-actions.js
          scripts/test-ai-usage-provider.js
          scripts/test-ai-usage-entrypoint.js
          scripts/test-ai-usage-wiring.js
          scripts/test-ai-usage-view.js
          scripts/test-ai-usage-filing.js
          scripts/test-ai-usage-lifecycle.js
          scripts/test-paste-target.js
          scripts/test-paste-lifecycle.js
          scripts/test-compositor-focus.js
          scripts/check-paste-injection.py
          scripts/test-launcher-search-gate.js
          scripts/check-notification-takeover.js
          scripts/test-remote-desktop-state.js
          scripts/test-idle-reload-snapshot.js
          scripts/test-idle-lock-request.js
          scripts/test-sudo-toggle-confirm.js
          scripts/test-pill-hover-safety.js
          scripts/test-launcher-hover-latch.js
          scripts/test-popout-dismiss-envelope.js

      # Wired in by VGS-50: all four were committed, maintained and invoked by
      # nothing until then.
      - name: Fixture and capability regressions
        run: |
          scripts/check-display-config-fixtures.js
          scripts/check-vgs-menu-capabilities.js
          scripts/check-vshell-ipc.sh
          # `smoke-surfaces.sh` itself is local-only (it needs a live Hyprland
          # VGS session), but its precondition classifier runs entirely off
          # stubs — a fake `qs` registry, a fabricated procfs, a stub `hyprctl`
          # — so the branch that decides skip-vs-fail IS checkable here.
          scripts/test-smoke-surfaces.sh
          # The only thing in CI that runs scripts/validate: its area selection,
          # fail-closed argument and manifest handling, and its skip channel.
          scripts/test-validate.sh
          scripts/test-qml-smoke.sh
          # Both vendor-drift checks are local-only (they need the .agents/
          # mirror), but the engine deciding which side of a drift is newer —
          # printing the wrong repair reverts a merged engine fix, VGS-155 —
          # runs off fixture repos, so that decision IS checkable here.
          scripts/test-vendor-drift.sh
          scripts/test-vendor-drift-evidence.sh
          scripts/test-vendor-drift-contracts.sh
          # `scripts/test-validation-inventory.sh` belongs with these but runs in
          # its own step at the END OF THE JOB — see that step for why. Order
          # here is free: each script builds its own mktemp tree.

      - name: Helper and CLI checks
        run: |
          scripts/check-vshell-helper.py
          scripts/check-brightness.py
          python3 -m py_compile bin/vshell-helper
          bash -n bin/vshell

      # AGENTS.md § Backend rules: this is what keeps the Go and QML sides of
      # the capability inventory in agreement. Pure text analysis, no toolchain.
      - name: Backend capability inventory
        run: |
          scripts/check-backend-inventory.py
          scripts/check-backend-inventory-tests.py

      # Quickshell matches reload children by index, so Lock.qml's child ORDER
      # is what keeps a session lock alive across a hot reload. Getting it wrong
      # aborts the shell on a save while locked, and nothing else in the suite
      # would catch it — the nested smoke never locks.
      - name: Lock reload order
        run: scripts/check-lock-reload-order.py

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Pinned to the version release.yml builds with, so a PR cannot pass
          # here on a toolchain the release never uses.
          go-version: 1.23.12
          # CACHING IS OFF ON PURPOSE, and this is the one place where measuring
          # inverted the obvious answer: the GOCACHE a cold run leaves behind is
          # ~20x the module download it skips, a net loss to save and restore on
          # a 2 vCPU runner. Figures and re-measure commands:
          # docs/decisions/D007-ci-single-job-economics.md.
          cache: false

      - name: Go build, vet and race tests
        working-directory: backend
        run: |
          go build ./...
          go vet ./...
          go test -race ./...

      # actionlint lints `run:` blocks by shelling out to shellcheck, and with
      # shellcheck absent it skips every one of them and still exits 0 (VGS-38).
      # scripts/check-workflows.sh FAILS on a missing tool rather than
      # degrading, so this trio has to be installed, not assumed. All three are
      # single static binaries, pinned and fetched from their releases —
      # shellcheck deliberately NOT taken from the runner image: shellcheck
      # adds and retunes checks across releases, so an image-supplied version
      # lets the format/lint floor's verdict drift from the documented local
      # run. The shellcheck and ruff pins are SINGLE-SOURCED from
      # scripts/check-format-lint.sh, which requires exactly those versions
      # locally — extracting them here means one bump site, and a bad
      # extraction fails the curl loudly rather than installing "latest".
      # GITHUB_PATH prepends, so RUNNER_TEMP shadows any image copy for every
      # later step; shellcheck and ruff feed the format/lint floor two steps
      # down, which fails on a missing or wrong-version tool the same way.
      - name: Install actionlint, shellcheck and ruff (pinned)
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          SHELLCHECK_VERSION="$(sed -n 's/^SHELLCHECK_VERSION=//p' scripts/check-format-lint.sh)"
          RUFF_VERSION="$(sed -n 's/^RUFF_VERSION=//p' scripts/check-format-lint.sh)"
          if [ -z "$SHELLCHECK_VERSION" ] || [ -z "$RUFF_VERSION" ]; then
            echo "::error::could not extract SHELLCHECK_VERSION/RUFF_VERSION from scripts/check-format-lint.sh — the single-source pins moved; fix the sed here in the same PR"
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          curl -fsSL -o "$RUNNER_TEMP/ruff.tar.gz" \
            "https://github.com/astral-sh/ruff/releases/download/${RUFF_VERSION}/ruff-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf "$RUNNER_TEMP/ruff.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 ruff-x86_64-unknown-linux-gnu/ruff
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"

      - name: Workflow lint (YAML and every `run:` block)
        run: scripts/check-workflows.sh

      # Formatter/lint floor over first-party Go/shell/Python/JS: gofmt -l,
      # shellcheck, ruff (rule floor in ruff.toml), node --check. Sits here
      # because it needs setup-go's gofmt plus the shellcheck/ruff install
      # above. A missing tool or an empty file set FAILS the check rather than
      # skipping it — a silent skip is indistinguishable from a pass.
      # test-format-lint.sh runs HERE rather than with the other test-*.sh
      # entries: it drives a copy of the check, so it needs the pinned
      # shellcheck and ruff installed two steps up.
      - name: First-party format and lint floor
        run: |
          scripts/check-format-lint.sh
          scripts/test-format-lint.sh

      # CodeRabbit rejects an invalid .coderabbit.yaml and reviews with DEFAULT
      # settings, reporting nothing on the PR. VGS shipped a 376-character
      # tone_instructions against a 250 limit, so the file was inert on every
      # PR. Validated against the vendored schema — offline, so an endpoint
      # outage cannot turn this into a skip.
      - name: CodeRabbit configuration
        run: scripts/check-coderabbit-config.py

      # qmllint is what `--require-static` needs, and no runner image ships Qt.
      # This is the single most expensive step here, which is why it is last.
      # Quickshell itself is NOT installed and does not need to be: the static
      # check tolerates unresolved qs.* imports by design and fails only on
      # `[syntax…]` findings.
      - name: Install qmllint (Qt 6 declarative tooling)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools

      # Covers both halves of the safety guard in one command: the repo-wide
      # scan for unsafe direct-launch instructions, and — via the argument it
      # forwards to the canonical smoke — the qmllint parse pass over the whole
      # QML tree in --require-static mode, so a missing qmllint fails loudly.
      # A plain skip is otherwise indistinguishable from a pass.
      #
      # --nested is NOT passed and cannot be: that sandbox needs a real Hyprland
      # plus a Quickshell install inside the runner. The live-session half of
      # this guard degrades cleanly here (no compositor and no Quickshell CLI →
      # "nothing of that kind exists on this system"), which is correct: there is
      # no live session in CI to disturb. The validation-scripts instruction
      # file's "What CI covers" tables record what that leaves local-only.
      - name: Validation safety and QML static smoke
        run: scripts/check-validation-safety.sh --require-static

      # MUST STAY THE LAST STEP OF THIS JOB. It is the only script in the job
      # that can exit 77 — the four-valued status scripts/validate defines, here
      # meaning a control the suite could not create (no PyYAML, or a libc that
      # resolves no Unicode space), so what ran passed but something did NOT run.
      # 77 is not a pass and is not treated as one: it reddens this step and the
      # job, exactly like a failure, and the summary names what was skipped.
      #
      # The step boundary is the whole containment, and it only works from LAST
      # place. Inside a `run:` block, `bash -e` stops at the 77 and drops the
      # commands after it; across the job, a red step makes GitHub's default
      # `if: success()` skip every LATER step. Last in the job there is no later
      # step to skip and nothing behind it in the block, so a 77 costs only the
      # report of this one suite while every other check has already run. Move
      # this step or add one after it and that containment is gone.
      #
      # Containment is placement only. Do NOT add `continue-on-error`, `set +e`,
      # or per-command exit-code handling: those would convert the 77 into a
      # green step, which is the false pass the four-valued exit exists to
      # prevent.
      - name: Validation inventory regressions
        run: scripts/test-validation-inventory.sh
