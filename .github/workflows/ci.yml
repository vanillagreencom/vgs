name: CI

# Run the scripts/validate manifest as named steps in one job.
# Keep CI / ci-ok stable because branch protection requires that context.
# Runner-cost rationale: docs/decisions/D007-ci-single-job-economics.md.

on:
  # Review events can create competing runs for the same head and cancel
  # the required check before the merge queue can use it.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge groups need their own required-check result to enter the queue.
  merge_group:
    types: [checks_requested]
  # Post-merge check on main: without it a red check on main persists unnoticed.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only pull requests cancel superseded runs. Push and merge-group runs
  # must finish to supply their required-check result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Harness engines are tested upstream. This job runs the committed engines.
  # review-gate-writer.yml owns review-gate status writes.
  validate:
    # Branch protection requires CI / ci-ok.
    name: ci-ok
    # CI_RUNNER_2V is an org variable; the ubuntu-latest fallback must keep working.
    runs-on: ${{ vars.CI_RUNNER_2V || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The whitespace check below diffs against the pull request base.
          fetch-depth: 0
          persist-credentials: false

      # Keep classification inside the required job: a skipped workflow leaves
      # the merge queue waiting for CI / ci-ok. The upstream classifier selects
      # full validation when it cannot establish a harness-only diff.
      - name: Classify the diff
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
        run: >-
          .agents/skills/harness-ci/scripts/harness-only
          --event "$EVENT" --base "$BASE" --head "$HEAD"

      # Run text checks before installing the Go and Qt toolchains.
      - name: Naming guard
        run: scripts/check-naming.sh

      # Compare the workflow commands with the scripts/validate manifest.
      - name: Validation inventory
        run: scripts/check-validation-inventory.py

      # The bot configs cannot read kendex.toml. Check their skill lists against
      # its in-place declarations.
      - name: Owned-skill register
        run: scripts/check-owned-skills.py
      # Run the guard in throwaway repositories to exercise its process wiring.
      - name: Owned-skill register controls
        run: scripts/test-owned-skills-e2e.py

      - name: Doc section pointers
        run: scripts/check-section-pointers.py
      # The label taxonomy is the allow-list the issue preflight consults; the
      # guard itself needs Linear and cannot run here, but its parser can.
      - name: Label taxonomy parser controls
        run: scripts/test-label-taxonomy.py

      - name: Doc section pointer controls
        run: |
          scripts/test-section-pointers.py
          scripts/test-section-pointers-e2e.py
          python3 scripts/lib/section_pointers_selftest.py
          python3 scripts/lib/tracked_blobs_selftest.py
          python3 scripts/lib/prose_blocks_selftest.py

      # The upstream path classes set limits; baseline entries may only shrink.
      - name: File-size ratchet
        run: .agents/skills/size-ratchet/scripts/size-ratchet

      # The pre-commit marker check sees added lines only. This scan also checks
      # existing tracked content outside tools/todo-ban-excludes.
      - name: Work-marker ban
        run: .agents/skills/growth-guards/scripts/todo-ban

      # A clean checkout has no working-tree diff. Compare the event range so CI
      # checks the whitespace introduced by the change.
      - name: Whitespace errors introduced by this change
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # An unresolved event base must fail; a substitute range could miss changes.
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              source="the pull request base"
              ;;
            # HEAD is the merge commit the queue built, so its first parent is
            # the queue base and the range is everything the group adds —
            # including a combination of several PRs that no single PR's own
            # range ever covered.
            merge_group)
              base="HEAD^1"
              source="the merge commit's first parent"
              ;;
            push)
              base="$PUSH_BEFORE"
              source="the previous tip of the branch"
              ;;
            # Fail closed rather than guessing: adding a trigger must be a
            # conscious decision about what this check compares against.
            *)
              echo "::error::whitespace check has no defined base for event $EVENT_NAME; define one before adding that trigger"
              exit 1
              ;;
          esac
          # Force-pushes, branch creation, or a root commit can make the selected
          # base unavailable. Do not substitute a smaller range.
          if [ -z "$base" ] || ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            echo "::error::cannot resolve $source ('$base') for event $EVENT_NAME, so the whitespace range is unknown and NOTHING was checked. Not falling back to a narrower range: that would pass while claiming coverage it does not have."
            exit 1
          fi
          echo "whitespace range: $base...HEAD ($source)"
          git diff --check "$base...HEAD"

      # Check local recipe consistency here. publish-aur.yml owns remote drift
      # checks so AUR availability does not gate unrelated pull requests.
      - name: Packaging metadata and assets
        run: |
          python3 scripts/lib/shell_scan.py
          python3 scripts/lib/qml_source_selftest.py
          scripts/gen-package-metadata.py
          scripts/check-package-assets.sh
          scripts/check-aur-sync.py

      # Undeclared command probes can hide a feature dependency from deps status.
      - name: Probed-command declarations
        run: scripts/check-command-declarations.py

      - name: Settings migration
        run: |
          node --check scripts/check-settings-migration.js
          scripts/check-settings-migration.js

      - name: Queue, theme-request and plugin-policy regressions
        run: |
          # pipefail preserves self-test failures when output is piped to grep.
          set -euo pipefail
          scripts/test-restyle-queue.js
          scripts/test-theme-requests.js
          scripts/test-latest-transaction-queue.js
          scripts/test-bundled-override.js
          scripts/test-plugin-requirement-report.js
          scripts/test-toast-actions.js
          node scripts/lib/qml-region-selftest.js | grep -qxF 'qml-region guard selftest: all checks passed'
          node scripts/lib/qml-region-wiring-selftest.js | grep -qxF 'qml-region wiring selftest: all checks passed'
          node scripts/lib/qml-region-testkit-selftest.js | grep -qxF 'qml-region testkit selftest: all checks passed'
          scripts/test-ai-usage-provider.js
          scripts/test-ai-usage-entrypoint.js
          scripts/test-ai-usage-wiring.js
          scripts/test-ai-usage-view.js
          scripts/test-ai-usage-filing.js
          scripts/test-ai-usage-lifecycle.js
          scripts/test-mercury-logic.js
          scripts/test-mercury-format.js
          scripts/test-mercury-options.js
          scripts/check-qml-imports.py
          scripts/test-qml-imports.sh
          scripts/test-paste-target.js
          scripts/test-paste-lifecycle.js
          scripts/test-compositor-focus.js
          scripts/check-paste-injection.py
          scripts/test-launcher-search-gate.js
          scripts/check-notification-takeover.js
          scripts/test-remote-desktop-state.js
          scripts/test-idle-reload-snapshot.js
          scripts/test-idle-lock-request.js
          scripts/test-sudo-toggle-confirm.js
          scripts/test-pill-hover-safety.js
          scripts/test-launcher-hover-latch.js
          scripts/test-popout-dismiss-envelope.js
          scripts/test-switcher-selection.js
          scripts/test-switcher-scope.js
          scripts/test-thumb-sweep.js
          scripts/test-flatline-controls.js
          scripts/test-brightness-scan-ordering.js
          scripts/test-wallpaper-thumbs.py
          scripts/test-wallpaper-thumb-cache.py
      - name: Fixture and capability regressions
        run: |
          scripts/check-display-config-fixtures.js
          scripts/check-vgs-menu-capabilities.js
          scripts/check-vshell-ipc.sh
          # The live-session smoke needs Hyprland and VGS. Its precondition tests
          # use stubs and can run in CI.
          scripts/test-smoke-surfaces.sh
          # Exercise the validation runner itself, including its skip status.
          scripts/test-validate.sh
          scripts/test-qml-smoke.sh
          # test-validation-inventory.sh runs in its own final step; see that step.

      - name: Helper and CLI checks
        run: |
          scripts/check-vshell-helper.py
          scripts/check-keybinds-display.py
          scripts/check-dev-tools.py
          scripts/check-brightness.py
          python3 -m py_compile bin/vshell-helper
          bash -n bin/vshell

      - name: Backend capability inventory
        run: |
          scripts/check-backend-inventory.py
          scripts/check-backend-inventory-tests.py

      # Quickshell matches reload children by index. Lock child order must
      # preserve the session lock across reloads.
      - name: Lock reload order
        run: scripts/check-lock-reload-order.py

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.classify.outputs.harness_only != 'true'
        with:
          # Pinned to the version release.yml builds with, so a PR cannot pass
          # here on a toolchain the release never uses.
          go-version: 1.23.12
          # Cache-cost rationale: docs/decisions/D007-ci-single-job-economics.md.
          cache: false

      - name: Go build, vet and race tests
        if: steps.classify.outputs.harness_only != 'true'
        run: |
          scripts/check-execbound-adoption.py
          scripts/check-execbound-adoption-tests.py
          go -C backend build ./...
          go -C backend vet ./...
          go -C backend test -race ./...
      # actionlint needs shellcheck to lint shell blocks. Install the pinned
      # tools required by check-workflows.sh and check-format-lint.sh.
      - name: Install actionlint, shellcheck and ruff (pinned)
        if: steps.classify.outputs.harness_only != 'true'
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          SHELLCHECK_VERSION="$(sed -n 's/^SHELLCHECK_VERSION=//p' scripts/check-format-lint.sh)"
          RUFF_VERSION="$(sed -n 's/^RUFF_VERSION=//p' scripts/check-format-lint.sh)"
          if [ -z "$SHELLCHECK_VERSION" ] || [ -z "$RUFF_VERSION" ]; then
            echo "::error::could not extract SHELLCHECK_VERSION/RUFF_VERSION from scripts/check-format-lint.sh — the single-source pins moved; fix the sed here in the same PR"
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          curl -fsSL -o "$RUNNER_TEMP/ruff.tar.gz" \
            "https://github.com/astral-sh/ruff/releases/download/${RUFF_VERSION}/ruff-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf "$RUNNER_TEMP/ruff.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 ruff-x86_64-unknown-linux-gnu/ruff
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"

      - name: Workflow lint (YAML and every `run:` block)
        if: steps.classify.outputs.harness_only != 'true'
        run: scripts/check-workflows.sh

      # These checks need the Go toolchain and pinned lint tools installed above.
      - name: First-party format and lint floor
        if: steps.classify.outputs.harness_only != 'true'
        run: |
          scripts/check-format-lint.sh
          scripts/test-format-lint.sh

      # Check the pinned CodeRabbit schema offline so invalid settings cannot
      # silently fall back to service defaults.
      - name: CodeRabbit configuration
        run: scripts/check-coderabbit-config.py

      # The static smoke needs qmllint. Unresolved Quickshell imports are
      # tolerated; syntax findings fail the check.
      - name: Install qmllint (Qt 6 declarative tooling)
        if: steps.classify.outputs.harness_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools

      # Require the static QML check. The nested runtime smoke needs a compositor
      # and Quickshell installation that this runner does not provide.
      - name: Validation safety and QML static smoke
        if: steps.classify.outputs.harness_only != 'true'
        run: scripts/check-validation-safety.sh --require-static

      # Keep this step last. Exit 77 means a control could not run and must fail
      # the job. GitHub skips later steps after a failure, so last position lets
      # the other checks finish. Do not convert the skip status into success.
      - name: Validation inventory regressions
        run: scripts/test-validation-inventory.sh
