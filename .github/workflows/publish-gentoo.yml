name: publish-gentoo

# The VanillaGreen Gentoo overlay is a separate repository that pulls nothing
# from this one, so an ebuild fix merged here reaches Gentoo users only when
# something pushes it. Nothing did: the overlay served 0.1.0 with none of the
# packaging fixes — no generated dependencies, no notification-daemon blockers,
# no extra-themes USE flag — while every other channel had them (VGS-204). This
# is the same failure the AUR had twice before publish-aur.yml existed.
#
# A stale overlay emerges and installs perfectly well. The failure is silent by
# construction, so the weekly run exists to look.

on:
  push:
    branches: [main]
    paths:
      - packaging/gentoo/**
      - scripts/publish-gentoo.sh
      - .github/workflows/publish-gentoo.yml
  workflow_call:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show what would be pushed without pushing it
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Never cancel: this pushes to another repository, and a cancelled run can
  # leave the overlay half written.
  group: publish-gentoo
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    runs-on: ${{ vars.CI_RUNNER_2V || 'ubuntu-latest' }}
    # The Manifest digests can only come from the release archive's actual
    # bytes, and that archive is ~1.1 GiB.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # A GitHub App rather than a stored key, and not only because deploy keys
      # are disabled by enterprise policy here: the token this mints expires in
      # an hour and is scoped to the overlay alone, so the repository stores no
      # credential that is useful to anyone who reads it.
      - name: Mint an overlay token
        if: ${{ inputs.dry_run != true }}
        id: overlay-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.GENTOO_OVERLAY_APP_ID }}
          private-key: ${{ secrets.GENTOO_OVERLAY_APP_PRIVATE_KEY }}
          owner: vanillagreencom
          repositories: gentoo-overlay

      - name: Configure git to use the overlay token
        if: ${{ inputs.dry_run != true }}
        env:
          OVERLAY_TOKEN: ${{ steps.overlay-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "$OVERLAY_TOKEN" ]; then
            # FAIL, do not skip. A skipped publish is the silent non-delivery
            # this workflow exists to end: the run would be green while the
            # overlay kept serving the previous release.
            echo "::error::No overlay token was minted. Set the GENTOO_OVERLAY_APP_ID variable and the GENTOO_OVERLAY_APP_PRIVATE_KEY secret, or publish by hand with scripts/publish-gentoo.sh and say so in the release notes."
            exit 1
          fi
          # A credential store, NOT a token embedded in the remote URL: the
          # publisher prints that URL in its diagnostics, and a URL-embedded
          # token would land in the run log the first time a clone failed.
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$OVERLAY_TOKEN" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Publish packaging/gentoo to the overlay
        env:
          GENTOO_COMMIT_NAME: ${{ vars.AUR_COMMIT_NAME }}
          GENTOO_COMMIT_EMAIL: ${{ vars.AUR_COMMIT_EMAIL }}
          DRY_RUN: ${{ inputs.dry_run }}
          # HTTPS, so the minted token authenticates through the credential
          # store above. The default remote is SSH, which this repo cannot use:
          # deploy keys are disabled by enterprise policy.
          VGS_GENTOO_OVERLAY_URL: https://github.com/vanillagreencom/gentoo-overlay.git
        run: |
          set -euo pipefail
          if [ "${DRY_RUN:-false}" = "true" ]; then
            scripts/publish-gentoo.sh --dry-run
          else
            # Exit 3, and ONLY 3, is "the release does not exist yet" — expected
            # between a version bump and its tag, and release.yml calls this
            # workflow again once the archive is up. Every other non-zero status
            # is a publish that delivered nothing and must stay red: a clone,
            # commit or push failure exits 1, and forgiving that here would be
            # the silent non-delivery this workflow exists to end.
            scripts/publish-gentoo.sh || case "$?" in
              3) echo "publish-gentoo: deferred until the release exists" ;;
              *) exit 1 ;;
            esac
          fi

  drift:
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    runs-on: ${{ vars.CI_RUNNER_2V || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: The published overlay still matches this repo
        env:
          VGS_GENTOO_OVERLAY_URL: https://github.com/vanillagreencom/gentoo-overlay.git
        run: scripts/publish-gentoo.sh --check
