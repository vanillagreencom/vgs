name: publish-gentoo

# Publishing is MANUAL: `scripts/publish-gentoo.sh`. Deploy keys are disabled for
# this organisation by enterprise policy, and an App was more setup than the one
# command it replaces.
#
# This workflow is the half that needs no credential: it reads the overlay over
# HTTPS and fails when it has drifted from packaging/gentoo/. Without it a stale
# overlay is invisible — it emerges and installs perfectly well (VGS-204).

on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-gentoo
  cancel-in-progress: false

jobs:
  drift:
    permissions:
      contents: read
    runs-on: ${{ vars.CI_RUNNER_2V || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: The published overlay still matches this repo
        env:
          VGS_GENTOO_OVERLAY_URL: https://github.com/vanillagreencom/gentoo-overlay.git
        run: scripts/publish-gentoo.sh --check
