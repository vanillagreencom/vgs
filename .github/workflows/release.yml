name: release

on:
  push:
    tags: ["v*"]

jobs:
  bundle:
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.23.12
          cache-dependency-path: backend/go.sum
      - run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - run: scripts/build-release.sh "$(cat VERSION)" "${{ matrix.arch }}" dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: vgs-${{ matrix.arch }}
          path: dist/*.tar.gz

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: vgs-*
          merge-multiple: true
          path: dist
      - run: git archive --format=tar --prefix="vgs-$(cat VERSION)/" HEAD | gzip -n -9 > "dist/vgs-$(cat VERSION)-source.tar.gz"
      - run: (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  # packaging/arch/PKGBUILD points source_* at the tarballs the job above
  # uploads, so the AUR can only be updated once they exist. Without this step
  # the recipe stays whatever was last pushed by hand, which is how VGS-5 and
  # VGS-53 shipped a stale package for two releases running.
  aur:
    needs: publish
    uses: ./.github/workflows/publish-aur.yml
    secrets: inherit