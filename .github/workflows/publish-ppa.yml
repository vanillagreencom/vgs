name: publish-ppa

# Launchpad builds the Ubuntu packages from a signed source upload of the
# release archive, so this runs only after the release is published.

on:
  # Called by release.yml once the tag's source archive is published.
  workflow_call:
    inputs:
      revision:
        type: string
        default: "1"
  workflow_dispatch:
    inputs:
      revision:
        description: Ubuntu revision N in X.Y.Z-1~ubuntu26.04.N; raise it to re-upload a release
        type: string
        default: "1"
      dry_run:
        description: Build the source package without signing or uploading it
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Two uploads of one version race for the same Launchpad name.
  group: publish-ppa
  cancel-in-progress: false

jobs:
  publish:
    # Reads this repo and the release archive; writes only to Launchpad.
    permissions:
      contents: read
    runs-on: ${{ vars.CI_RUNNER_2V || 'ubuntu-latest' }}
    # Covers both waits below (30 min for the listing, 45 for the binaries) plus the build.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install the source-package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends devscripts dpkg-dev dput

      - name: Publish the source package to the PPA
        env:
          PPA_ACCEPT_TIMEOUT: "1800"
          PPA_SIGNING_KEY_ID: ${{ vars.PPA_SIGNING_KEY_ID }}
          PPA_SIGNING_PRIVATE_KEY: ${{ secrets.PPA_SIGNING_PRIVATE_KEY }}
          PPA_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PPA_SIGNING_PRIVATE_KEY_PASSWORD }}
          REVISION: ${{ inputs.revision || '1' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--revision "$REVISION")
          if [ "${DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          elif [ -z "$PPA_SIGNING_PRIVATE_KEY" ]; then
            # Without the imported key, signing would fall back to a runner keyring that has none.
            echo "::error::PPA_SIGNING_PRIVATE_KEY is not set, so nothing can be signed. Add the secret, or publish by hand with scripts/publish-ppa.sh and say so in the release notes."
            exit 1
          fi
          scripts/publish-ppa.sh "${args[@]}"

      # Its own step, because pip runs a dependency's own build code, and
      # nothing should run that while the Launchpad token is readable.
      - name: Install the Launchpad client
        if: ${{ inputs.dry_run != true }}
        run: python3 -m pip install --user --break-system-packages launchpadlib

      # Launchpad keeps a superseded source and its binaries published until
      # someone deletes them, which is how the retired vgs-shell-assets stayed
      # installable after 0.5.0 replaced it.
      - name: Delete the PPA publications this release supersedes
        if: ${{ inputs.dry_run != true }}
        env:
          LP_CREDENTIALS: ${{ secrets.LP_CREDENTIALS }}
          PPA_PRUNE_TIMEOUT: "2700"
        run: |
          set -euo pipefail
          if [ -z "$LP_CREDENTIALS" ]; then
            echo "::error::LP_CREDENTIALS is not set, so superseded packages stay published. Add the secret, or run scripts/prune-ppa.py by hand and say so in the release notes."
            exit 1
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/lp-credentials"
          printf '%s' "$LP_CREDENTIALS" >"$RUNNER_TEMP/lp-credentials"
          LP_CREDENTIALS_FILE="$RUNNER_TEMP/lp-credentials" scripts/prune-ppa.py
