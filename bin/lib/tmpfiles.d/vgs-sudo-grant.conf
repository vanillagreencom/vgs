# Installed as /etc/tmpfiles.d/vgs-sudo-grant.conf by `vgsh sudo install`.
# vgsh sudo grant writes each passwordless grant as one file in this name
# space. Its expiry timer does not survive a reboot, so early boot removes
# every grant left; `!` keeps a later tmpfiles run from ending a live one.
r! /etc/sudoers.d/99-vgs-nopasswd-*
