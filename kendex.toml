[skill-instructions]
linear = '''
## Tracker policy: Linear is canonical; GitHub Issues is intake-only

Create, label, and work issues ONLY in Linear (team vg-shell, identifiers
VGS-<n>). GitHub Issues stays as intake, and nothing syncs back. Before creating
a Linear issue, dedupe across BOTH trackers (`gh issue list --search` + Linear
cache) — never file the same problem twice.

Mirroring GitHub intake into Linear is a MANUAL triage step. No automation does
it: there is no sync workflow under `.github/` and no Linear-side GitHub
integration creating issues, so an unmirrored GitHub issue never reaches the
canonical tracker and can sit unseen indefinitely. Run the triage pass when
picking up work:

```bash
gh issue list --state open --limit 50 --json number,title,url,createdAt \
  --jq '.[] | [.number, .createdAt, .url, .title] | @tsv' &&
.agents/skills/linear/scripts/linear.sh cache issues list --all-projects
```

The two listings are chained: a `gh issue list` that fails prints nothing, and
unchained the Linear listing's success becomes the block's — an empty GitHub
column then reads as "nothing to mirror", the exact false-clean this pass exists
to prevent.

For each GitHub issue with no Linear counterpart, fetch title, body and url in
one call and build the description — the full body plus a provenance line back
to the GitHub issue — then create it in team vg-shell and work the Linear issue
rather than the GitHub one:

```bash
gh_json= gh_body= &&
gh_json="$(mktemp)" &&
gh_body="$(mktemp)" &&
gh issue view <n> --json title,body,url > "$gh_json" &&
jq -r '(.body | sub("\\s+$"; "")) + "\n\n---\n\nMirrored from GitHub issue [" + .url + "](<" + .url + ">) (intake-only tracker)."' "$gh_json" > "$gh_body" &&
{ [ -s "$gh_body" ] || { echo "mirror: description body is empty, not creating" >&2; false; }; } &&
title="$(jq -r .title "$gh_json")" &&
.agents/skills/linear/scripts/linear.sh issues create --title "$title" \
  --description-file "$gh_body"
created=$?
cleaned=0
for tmp in "$gh_json" "$gh_body"; do
  [ -n "$tmp" ] || continue
  rm -f -- "$tmp" || { cleaned=1; echo "mirror: could not remove $tmp, which still holds the issue JSON or body" >&2; }
done
( exit "$(( created ? created : cleaned ))" )
```

Run that block as a UNIT, in one shell — the `mktemp` paths live in variables,
so a command run on its own would find them empty and redirect to nothing.

NO STEP'S FAILURE MAY BE MASKED BY A LATER STEP'S SUCCESS. Every producing step
is chained with `&&`, so the first failure short-circuits the rest and becomes
the list's status; `created=$?` captures it, the cleanup loop runs on every path,
and `( exit ... )` re-raises it. That direction is the worst one here — this is
the manual GitHub-to-Linear step, so a masked failure means work never filed and
never noticed. Each shape below was a real silent failure before it was written
this way:

* `rm -f` last made ITS status the block's, and `rm -f` almost always succeeds:
  a create that failed on credentials, validation or an API error reported
  success and the agent believed the issue was filed.
* `gh issue view` and the description `jq` ran unchecked, so the create ran on
  whatever landed in the file — an empty description, the GitHub body and the
  provenance line lost, reported as success.
* the title `jq` ran inside the create's own argument list, where a command
  substitution's status is discarded whatever it exits with; hoisting it into
  `title=` is what makes that status visible.
* `[ -s "$gh_body" ]` because a status is a PROXY — what must be true is that
  the file has CONTENT — and it speaks when it refuses, since an
  empty-but-succeeded producer prints no diagnostic of its own.
* the cleanup itself ran unchecked, so a `rm` that failed after a successful
  create left the issue JSON and the rendered body on disk while the block
  reported success. `cleaned` records it, the loop names the file that survived,
  and the status is `created` when the create failed and `cleaned` otherwise —
  the create's failure is the more important one and still wins, but a cleanup
  failure can no longer vanish behind it.

`gh_json= gh_body=` BEFORE the first `mktemp`, and this one is about the
operator's own shell rather than about statuses. You paste this block into an
interactive shell, where `set -u` is off and both names may already be in use.
If the FIRST `mktemp` fails, the `&&` chain stops before `gh_body` is ever
assigned — and the cleanup at the bottom still runs, expanding whatever
`gh_body` happened to mean in your session and `rm`-ing a file this block never
created. Initializing both to empty first is what makes that impossible, and the
loop skips an empty path rather than passing it to `rm`. A runbook a person
pastes into their own shell must not be able to delete a file they named.

`( exit ... )` rather than a bare `exit`, which would close an operator's
interactive shell, and rather than a `trap ... EXIT`, which would linger in that
shell for the rest of the session. `mktemp`, not `/tmp/gh-<n>.json`: that path is
fully predictable from the issue number, so two lanes mirroring the same issue
overwrite each other's file, and a pre-created symlink there would be followed by
the redirect.

The list query carries `url` so the triage table is actionable; `body` is
fetched per issue rather than for all 50, and every field the description needs
comes from these commands alone — no extra lookup.

Automating this needs owner action (Linear workspace admin, or a LINEAR_API_KEY
repo secret) — see docs/decisions/D002-github-linear-intake-sync.md.

Link work to its issue through the branch name: `vgs-<n>-<slug>`. Linear's
GitHub integration matches that to attach the PR, and `GH_ISSUE_PATTERN` in
vstack.settings.toml reads the same shape. Commit subjects carry the identifier
as the scope — `area(VGS-12): imperative summary` — per AGENTS.md § Conventions.

Issue labels are live Linear issue labels. Inventory source of truth:

```bash
.agents/skills/linear/scripts/linear.sh cache labels list &&
.agents/skills/linear/scripts/linear.sh sync --reconcile
```

Chained for the same reason: a `cache labels list` that fails prints no labels,
and unchained the reconcile's success becomes the block's — leaving an agent
believing it read the live inventory when it read nothing.

Use the project-management label taxonomy when assigning labels. If the
taxonomy and live inventory disagree, stop before mutation and report the
missing/extra label; do not substitute a nearby label. Never create labels
without explicit user authorization.

`issues create/update --labels` replaces the full issue label set. For label
updates, compute the intended final full set from current labels: replace only
the target exclusive category (`agent:*`), preserve unrelated
classification/workflow labels, then pass the full validated set.
'''
project-management = """
## Linear projects

Every new non-mirror issue gets exactly one project. The set (all team
vg-shell):

| Project | Scope |
|---------|-------|
| `Tech Debt & Bugs` | Hygiene and discovered pre-existing issues — bugs, cleanup, tooling/workflow debt that fits no feature area. |
| `Shell Runtime & Widgets` | Quickshell runtime, modules, widget primitives, design language, idle/lock/greeter session surfaces. |
| `Theme Engine & Wallpapers` | Themes, palettes, blueprints, generated app targets, wallpaper pipeline and upscaling. |
| `Backend & System Services` | Go backend daemon, socket protocol/capability gating, system integrations (network, logind, BlueZ, CUPS), helper CLI. |
| `Packaging & Install Channels` | install.sh, distro packages (Arch/Debian/Fedora/Gentoo/Void/Nix), release verification, channel upkeep. |
| `Cloud Sync` | Supervised rclone, accounts/OAuth, sync modes and safety rails, watcher, FUSE mounts, Cloud Sync app/widget. |

A bug inside a feature area goes to that area's project, not Tech Debt & Bugs;
the hygiene project is for cross-cutting debt and pre-existing discoveries.
Synced `nightly-ci:` mirrors arrive with no project — route them to
`Tech Debt & Bugs` on first triage. Creating a new project is an owner
decision: propose it, do not create it unprompted.

## Project issue label taxonomy

Use this taxonomy with the linear skill's label-inventory preflight for roadmap
creation, audit-created issues, research issues, and any other issue
create/update path.

Required for new non-historical issues:
- Exactly one Agent label.
- Classification and Workflow labels are optional and additive.
- Domain labels apply when the work clearly sits in that domain.

Label creation rule: if a label listed here is missing from live Linear
inventory, stop and ask for explicit user authorization to create it. Do not
create labels automatically and do not silently omit or substitute labels.

### Agent labels (exclusive; choose exactly one)

| Label | Use when |
|-------|----------|
| `agent:generalist` | Maintenance, docs cleanup, tooling/workflow tasks, repository organization, or mixed low-risk work — including QML/Go/helper implementation until dedicated domain agents exist. |
| `agent:multi` | Bundle parent or coordination issue whose children span 2+ domains. Avoid on leaf implementation issues unless the issue is truly orchestration-only. |
| `agent:human` | Manual/user-owned work, external dependency/vendor action, or work intentionally not delegated to an AI agent. |
| `agent:researcher` | Research issue owned by the researcher workflow/agent. Must be paired with `research`. |

`agent:iced` and `agent:rust` are workspace-level labels inherited by every
team; they serve other projects (hyprtrade), so never assign them in VGS.

### Domain labels (non-exclusive; choose all that apply)

| Label | Use when |
|-------|----------|
| `ci-infra` | CI, review gates, runners, and repo tooling — the validation suite, `.github/workflows/`, packaging automation. |
| `test` | Testing itself: coverage, harnesses, fixtures, flakes. Pairs with `ci-infra` when the harness is CI-owned. |
| `frontend` | UI-surface work: shell surfaces, widgets, modals, settings screens under `quickshell/vshell/`. |
| `design` | Visual design language, tokens, typography, surface layout — the Flatline language in `docs/architecture/design-language.md`. |
| `component` | Reusable widget/control work, especially primitives in `quickshell/vshell/Widgets/`. |

Priority rule: `ci-infra` implies Urgent unless the issue deliberately records
why it is lower. Everything VGS uses to decide whether a change is safe to merge
lives in that category, so a defect there invalidates the evidence behind every
other issue's "verified" claim.

### Classification labels (non-exclusive; additive)

| Label | Use when |
|-------|----------|
| `bug` | Defect in shipped behavior. |
| `enhancement` | New feature or request. |
| `chore` | Mechanical/maintenance work, no behavior change. |
| `docs` | Documentation work. |
| `security` | Security-relevant surface or hardening work. |
| `refactor` | Restructure/migration/cleanup where behavior should mostly remain unchanged. |
| `research` | Research spike/issue whose primary output is findings/decision support. Pair with `agent:researcher`. |
| `baseline` | Establishes a measurement baseline, benchmark fixture, golden data, or pre-optimization reference. |

### Workflow labels (non-exclusive; additive)

| Label | Use when |
|-------|----------|
| `needs-research` | Blocked on unresolved research. Prefer a blocking relation to a research issue when one exists. |
| `needs-review` | Requires an explicit review gate before execution/merge/close. |
| `needs-safety-audit` | Concurrency, lock-free, memory/thread safety, or safety-critical validation required. |
| `needs-perf-test` | Benchmark/profiling/performance validation required before acceptance. |
| `critical-path` | Blocks or enables major project progress; align priority accordingly. |
| `blocked` | External blocker only (vendor/license/access/manual dependency). For issue dependencies, use blocking relations instead. |
| `owner-gated` | Needs an owner decision or owner-only action to proceed. |
| `hardware-blocked` | Blocked on physical hardware or device/OS access — a second monitor, a fingerprint reader, an Apple display — rather than on a decision or another issue. |
| `re-triage` | Request one triage-janitor pass (Linear Loop 2) over an issue whose labels, project, or priority look wrong. The automation REMOVES it when the pass completes, so it is a trigger, not a state — an issue carrying it long-term means the loop did not run. Expect zero issues to carry it at rest. |

`ci-nightly` marks CI-failure mirrors; the taxonomy above does not apply to
mirrored issues — do not retitle or relabel them to satisfy it. Note there is
no automated ingest: mirroring GitHub intake into Linear is manual, per the
tracker policy in the linear skill instructions.

### Never-use labels

These are live in the workspace and must never be assigned in VGS. The reason
matters as much as the verdict: a label omitted with no explanation reads as an
oversight, and gets "fixed" by someone assigning it.

| Label | Why never |
|-------|-----------|
| `Agent` | Group/parent label. Assign one of its children, never the group itself. |
| `Platform` | Group/parent label, same rule. |
| `ios` | VGS is a Wayland shell for Hyprland or Niri. Can never apply. |
| `macos` | Same. |
| `windows` | Same. |
| `cross-platform` | Same — VGS targets exactly one platform, so nothing here is cross-platform. |
| `linux` | Vacuously true for every VGS issue, so it carries no information. |
| `agent:iced` | Workspace-level label inherited by every team; serves hyprtrade. |
| `agent:rust` | Same. |
| `iced` | Same. |
| `rust-core` | Same. |
| `feature` | Duplicate of `enhancement` ("New capability or product behavior" vs "New feature or request"). VGS uses `enhancement`; `feature` is on zero VGS issues. It is workspace-level and may serve another team, so do not delete it — just do not assign it here. |
"""
reviewer = """
## VGS review policy

Risk-classed review depth and the regression-test expectation live in
`review-bots.md` (repo root, § Risk classes and § Regression-test
expectation) — that file is the source; apply both. In short: every
bug-fix PR carries a check or test that failed before the fix; a
bug-fix PR without one gets that as a standing finding (docs-only fixes
exempt). Findings on high-risk classes — gate/CI machinery,
lock/session/idle surfaces, packaging/publish install channels, and
privileged operations (elevation or system writes, WHEREVER they live —
not only `backend/`) — are merge-blocking by default. The class
definitions and derivation commands stay in review-bots.md; do not
re-derive them from this summary.
"""

