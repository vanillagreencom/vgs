# The smoke sandbox's PipeWire daemon, read through PIPEWIRE_CONFIG_DIR
# set to this directory alone, so no host fragment under /etc/pipewire or
# the user's ~/.config/pipewire reaches it (scripts/smoke/devices.sh).
# Null-only: the SPA libraries list holds no ALSA, BlueZ, V4L2 or
# libcamera plugin, and no spa-device-factory, rt, portal or x11-bell
# module loads, so this process can open no sound, camera or radio
# device. Its nodes: two null sinks, one filter-chain sink in front of
# the speakers for the DSP case, and one test-tone source. A null sink
# given media.class Audio/Source never activates in WirePlumber 0.5.17,
# and Quickshell 0.3.1 lists only that class as a source
# (src/services/pipewire/node.cpp), so the source is audiotestsrc.
context.properties = {
    core.daemon      = true
    core.name        = pipewire-0
    link.max-buffers = 16
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
    audiotestsrc    = audiotestsrc/libspa-audiotestsrc
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    # Without the access module no client is given permissions, so no
    # client, WirePlumber included, gets past its first round trip.
    { name = libpipewire-module-access }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Smoke Equalizer"
            media.name       = "Smoke Equalizer"
            filter.graph = {
                nodes = [ { type = builtin name = copy label = copy } ]
            }
            audio.position = [ FL FR ]
            capture.props  = { node.name = "vgs-smoke-equalizer" media.class = "Audio/Sink" }
            playback.props = { node.name = "vgs-smoke-equalizer.output" node.passive = true target.object = "vgs-smoke-speakers" }
        }
    }
]
context.objects = [
    { factory = spa-node-factory
        args = { factory.name = support.node.driver node.name = Dummy-Driver node.group = pipewire.dummy priority.driver = 200000 }
    }
    { factory = adapter
        args = { factory.name = support.null-audio-sink node.name = vgs-smoke-speakers node.description = "Smoke Speakers"
                 media.class = Audio/Sink audio.position = [ FL FR ] priority.session = 2000 }
    }
    { factory = adapter
        args = { factory.name = support.null-audio-sink node.name = vgs-smoke-headphones node.description = "Smoke Headphones"
                 media.class = Audio/Sink audio.position = [ FL FR ] priority.session = 1000 }
    }
    { factory = adapter
        args = { factory.name = audiotestsrc node.name = vgs-smoke-microphone node.description = "Smoke Microphone"
                 media.class = Audio/Source audio.position = [ MONO ] }
    }
]
