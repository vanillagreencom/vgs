# The smoke sandbox's WirePlumber profile, placed under the sandbox
# HOME's wireplumber.conf.d and chosen with `wireplumber --profile
# vgs-smoke` (scripts/smoke/devices.sh). Every hardware feature is off:
# no ALSA, ALSA MIDI, BlueZ, BlueZ MIDI, V4L2 or libcamera monitor runs,
# so WirePlumber opens no /dev/snd or /dev/video node and manages only
# the sandbox PipeWire's null nodes. Device reservation, the portal, logind
# and the saved state are off too: the first three reach the session or
# system bus, and the state would carry one row's default device into the
# next start.
wireplumber.profiles = {
  vgs-smoke = {
    inherits = [ main, mixin.stateless ]
    hardware.audio = disabled
    hardware.bluetooth = disabled
    hardware.video-capture = disabled
    monitor.alsa = disabled
    monitor.alsa-midi = disabled
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
    support.reserve-device = disabled
    monitor.alsa.reserve-device = disabled
    support.portal-permissionstore = disabled
    script.client.access-portal = disabled
    support.logind = disabled
    monitor.bluez.seat-monitoring = disabled
  }
}
