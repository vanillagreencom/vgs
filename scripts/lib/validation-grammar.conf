# THE VALIDATION MANIFEST GRAMMAR — the one definition, as DATA (VGS-123).
#
# Eight holes in this change came from one cause: the grammar existed as prose
# in a header plus several consumers that each RE-DERIVED it. Every reviewer
# found the next unstated rule. So the vocabulary and the rules live here, once.
#
# ONE READER, and it is scripts/validate. Writing one definition ended "the
# grammar exists in two places" but left TWO READERS of it, and they disagreed
# about invalid and ambiguous input three separate times — the lone-modifier
# wording, a set() de-duplication, and a duplicate class declaration each reader
# merged differently. Same bug one level up. So this file has exactly one
# parser: scripts/validate reads and VALIDATES it, and `scripts/validate
# --dump-grammar` emits the normalized result. scripts/lib/validation_manifest.py
# DECODES that dump; it does not read this file, and neither does
# scripts/check-validation-inventory.py.
#
# A conformance corpus was the alternative and was rejected deliberately: a
# corpus ENUMERATES malformed shapes, and the lesson of these eight holes is
# that such enumerations are incomplete. A corpus would have caught neither the
# missing-trailing-newline divergence nor the metadata-pass indexing bug, both
# of which surfaced only while fixing something else. One reader makes
# divergence impossible by construction instead of detectable afterwards.
#
# scripts/test-validate.sh GENERATES its must-fail controls from this file (via
# the dump), so adding a rule here produces the control that proves it.
#
# FORMAT: line-oriented, `kind` then fields, `#` comments, blank lines ignored.
# Chosen because bash reads it with `read` and the DUMP is decoded with
# `str.split()` — no `jq`, no `tomllib`, no eval of repo text, and no new
# dependency anywhere. JSON would need jq in the shell; TOML would need 3.11+;
# a sourceable .sh would put eval of file contents on the runner's start-up path.
#
#   kind    <name> min=N [max=N]
#   class   <name> selects=<yes|no> standalone=<yes|no> rowtag=<yes|no> exclusive=<yes|no> cli=<yes|no> universal=<yes|no> skips=<yes|no> [min=N] [max=N]
#   token   <name> <class>
#   message <key> <text>
#
# All SEVEN class booleans are required, once each — the list above is the
# record's shape, not a sample of it, and it read as four for as long as the
# properties below it numbered seven.
#
# EVERY RECORD IS DECLARED AT MOST ONCE. A duplicate `class` line was accepted
# silently and merged differently by each of the two former readers — one
# replaced the whole record, the other overwrote only the keys the later line
# mentioned — so the same file meant two things. The rule is stated for every
# line kind rather than for `class` alone, because "a name declared twice" is
# the rule and `class` was only the shape that surfaced.
#
# THE ARITY OF EVERY LINE KIND IS ITSELF DECLARED, in the `kind` lines below,
# and the reader checks a record's field count against that table BEFORE
# indexing anything from it. Previously each branch indexed fields it had not
# proven present: a bare `token` line took `$name` as an array subscript and
# gave the runner a raw bash error at rc 1 — indistinguishable from an ordinary
# check failure. It was never a `token` bug: three of the four kinds did it.
# Declaring arity means a new line kind cannot be added without one.
#
# CLASS PROPERTIES ARE PARSED BY KEY, never by position, and the seven booleans
# are required once each with a yes/no value. `min` and `max` are optional
# counts (default min=0, unbounded max) and must be DECIMAL INTEGERS — they are
# not booleans, and reporting `min=banana` as "must be yes or no" named the
# wrong rule for the value that was wrong.
#
# THE INVARIANTS ARE `min`/`max`, stated here so the runner enforces them before
# it runs anything. Previously only the guard knew "exactly one exclusive", and
# the runner ran happily against a grammar the guard was about to reject — the
# runner goes first and the guard is just another check in the suite. As counts:
#
#   area       min=1        at least one scope must exist, or nothing is
#                           addressable and every area run is empty
#   exclusive  min=1 max=1  the tag pattern has exactly one "alone" alternative;
#                           two would make the pattern ambiguous, none would
#                           leave `-`-style rows unexpressible
#   argument   min=1 max=1  its single token IS the runner's default area, so
#                           zero breaks a bare `scripts/validate` and two leaves
#                           the default undecidable
#   selector   min=0        `always` is a convenience; areas already select
#   modifier   min=0        nothing requires a modifier to exist
#
# THREE INVARIANTS ARE NOT EXPRESSIBLE AS PER-CLASS COUNTS, so they are stated
# here and enforced in the runner's pre-flight rather than left implicit:
#
#   * the tag pattern needs at least one COMBINABLE row tag, which `area min=1`
#     guarantees since areas are combinable.
#   * EXACTLY ONE TOKEN is eligible to be the CLI default — `cli=yes` with
#     `rowtag=no` — counted across ALL CLASSES. `argument min=1 max=1` looks
#     like this rule and is not: it bounds the tokens of that one class and says
#     nothing about how many classes may carry the property pair that actually
#     decides the default. A second such class left `--list docs` at rc 0 over
#     four commands while the runner picked one of two candidates silently.
#     Stated as a property pair, not as "the `argument` class", because the
#     properties are what the resolution reads.
#   * NO ROW TAG MAY SELECT ONLY THE DEFAULT AREA. C3 — the constraint in
#     scripts/validate's manifest-grammar header that `all` is an ARGUMENT to
#     that script and never a tag; C1-C4 are numbered there — keeps `all` out of the tag
#     vocabulary because as a tag it would match only an `all` run and behave
#     like `-` everywhere else; a token with `selects=yes` that is neither an
#     area (`cli=yes`) nor `universal=yes` nor `exclusive=yes` has exactly that
#     behaviour, reached through a PROPERTY rather than through a name. The edit
#     is a single yes/no flip — `universal=no` on the class below that carries `always`
#     — and it is self-concealing: every `always` row leaves every scoped run,
#     including the inventory guard that would report the edit.
#
# The class PROPERTIES are the rules, which is what makes them checkable and
# generatable rather than prose:
#
#   selects     the token decides WHEN a row runs. A row needs at least one.
#   standalone  the token may be a row's only tag.
#   rowtag      the token may appear in a row's tag field at all.
#   exclusive   the token may not be combined with any other tag.
#   cli         `scripts/validate <token>` accepts it as the area argument.
#   universal   it selects EVERY area, not just one named after it.
#   skips       a row carrying it may report exit 77 as a skip.
#
# The last three exist because the reader was still naming tokens and classes
# literally where a property was the honest question: `[[ "$class" == area ||
# "$class" == argument ]]` for the argument vocabulary, `*",always,"*` in the
# selection loop, and `*",may-skip,"*` in the skip channel. Each of those is a
# rule about what a token DOES, so each is now a property it carries. The
# runner's default area is likewise derived — the one token with cli=yes and
# rowtag=no — rather than the literal `all`.
#
# THE DUMP is what every other consumer sees, and it is NORMALIZED: one line per
# record, every boolean present in a fixed order, `min` always present, `max`
# either an integer or `-` for unbounded, and a `source` line naming the file
# the runner read. Defaults are resolved by the runner, so a decoder never
# supplies one — supplying defaults is how a second reader starts having
# opinions.
#
#   source     <absolute path to this file>
#   default    <token>       the runner's RESOLVED default area
#   whitespace <hh> ...      the ASCII whitespace set of C4, as hex codepoints
#   class      <name> selects=.. standalone=.. rowtag=.. exclusive=.. cli=.. universal=.. skips=.. min=N max=<N|->
#   token      <name> <class>
#   message    <key> <text>
#
# `whitespace` is dumped because C4 — whitespace is ASCII and removed before
# matching, stated with C1-C3 in scripts/validate's header — is a rule about a
# SET, and the set lived in
# two places: `ASCII_SPACE` in the runner and a regex in the library, under a
# comment claiming they moved together. Nothing enforced that, and no locale
# control could — a locale changes what a CLASS means, not what a spelled-out set
# contains. It travels as hex codepoints because the set contains a newline.
#
# `default` is dumped rather than left to be recomputed. A consumer deriving it
# from the tokens is not a second PARSER, but it is a second place the rule is
# written — and that is the same thing wearing a different name: it is how the
# guard came to reject a grammar the runner had accepted.
#
# THE ONE RULE THAT IS NOT DATA, named rather than left implicit: what each
# token actually DOES at run time — that `always` selects every area, that
# `may-skip` permits exit 77 — is behaviour, and lives in scripts/validate's
# selection and run loops. This file says which tokens exist and how they may
# be combined; it cannot say what they mean. The wiring check in
# check-validation-inventory.py is what ties a declared token to real code.

# min/max count the fields AFTER the kind word. ARITY ONLY PROVES INDEXING IS
# SAFE — that a record has the fields its branch reads — so `class` needs just a
# name and one property here; whether it carries the right FOUR properties is a
# semantic check the class validator owns. A tighter arity would shadow those
# richer diagnostics with a field count. `kind` lines are the bootstrap: they
# are validated inline against this same shape before the table exists.
kind kind    min=2
kind class   min=2
kind token   min=2 max=2
kind message min=2

class area       selects=yes standalone=yes rowtag=yes  exclusive=no  cli=yes universal=no  skips=no  min=1
class selector   selects=yes standalone=yes rowtag=yes  exclusive=no  cli=no  universal=yes skips=no  min=0
class modifier   selects=no  standalone=no  rowtag=yes  exclusive=no  cli=no  universal=no  skips=yes min=0
class exclusive  selects=yes standalone=yes rowtag=yes  exclusive=yes cli=no  universal=no  skips=no  min=1 max=1
class argument   selects=no  standalone=no  rowtag=no   exclusive=no  cli=yes universal=no  skips=no  min=1 max=1

# The areas. Each names a scope of the manifest and is usable as a row tag and
# as the command-line argument.
token go         area
token qml        area
token helper     area
token packaging  area
token docs       area

# Selects every area without being one. The bar is high and all three parts are
# load-bearing: cheap, network-free, and correct in ANY checkout — a plain
# clone, a CI-shaped checkout, a worktree made before `kendex refresh`. A check
# that hard-fails when some out-of-tree artifact is absent does not qualify
# however fast it is; the vendor-sync checks are exactly that, and are `-`.
token always     selector

# Permits exit 77, "precondition absent, nothing checked". Never selects, so a
# row carrying only this one would vanish from every named area while still
# running under `all`.
token may-skip   modifier

# Only the full `all` run selects this row. Exclusive: "only `all` runs this"
# cannot also be true of a row that names an area.
token -          exclusive

# The command-line argument for "every row". Never a row tag: as a tag it would
# match only an `all` run and behave like `-` everywhere else, which is the
# silent-narrowing shape this vocabulary exists to stop.
token all        argument

# ─── SHARED DIAGNOSTICS ─────────────────────────────────────────────────────
#
# Two groups, and they are load-bearing in different ways.
#
# The `grammar-*` messages are the GRAMMAR reader's, and there is now only one
# of those — scripts/validate. They stay here rather than in the runner because
# this file is the thing they describe, and because
# scripts/test-validation-inventory.sh generates its controls' expected text
# from them.
#
# The `row-*` messages are still emitted by TWO readers, because the MANIFEST is
# still read twice on purpose: the runner decides what runs, and
# validation_manifest.py must be able to report a manifest with its per-row
# tags. Those two are pinned against the text HERE, not against each other, so a
# drift cannot pass by both sides moving together. The lone-modifier text
# drifted twice and was hand-synchronised twice before it moved into this file.
#
# Messages emitted by only ONE reader stay in that reader and are listed in its
# own comments: the runner alone has usage and area-argument errors, and the
# library alone has the heredoc, empty-manifest, dump-decode, PyYAML,
# bash-launch, ci.yml, prose and table messages.

message row-no-separator    manifest row has no `AREAS | COMMAND` separator
message row-empty-tags      manifest row has an empty tag field
message row-malformed-tags  manifest row has a malformed tag field
message row-not-standalone  manifest row's only tag cannot stand alone
message row-no-selector     manifest row carries no selector
message row-empty-command   manifest row has an empty command
message row-bad-syntax      manifest row has invalid shell syntax
message grammar-bad-class   grammar token has an unknown class
message grammar-bad-kind    grammar has an unknown line kind
message grammar-duplicate   grammar declares the same record twice
message grammar-token-fields  grammar token line must be `token <name> <class>`
message grammar-class-malformed  grammar class property must be key=value
message grammar-class-value  grammar class property must be yes or no
message grammar-count-value  grammar min and max must be decimal integers
message grammar-default-count  grammar must declare exactly one CLI default token
message grammar-inert-selector  grammar row tag selects nothing in any named area
message grammar-class-missing  grammar class is missing a property
message grammar-repeated-field  grammar record repeats a field
message grammar-unknown-field  grammar record has an unknown field
message grammar-class-count  grammar declares the wrong number of tokens in a class
message grammar-token-name  grammar token name must be lowercase
message grammar-arity  grammar line has the wrong number of fields
