# Validation manifest vocabulary. scripts/validate parses this data and --dump-grammar
# emits its normalized result for other consumers. Consumers must not derive defaults independently.
#
# Format: a line kind followed by whitespace-separated fields. Blank lines and # comments are ignored.
#   kind <name> min=N [max=N]
#   class <name> selects=<yes|no> standalone=<yes|no> rowtag=<yes|no> exclusive=<yes|no> cli=<yes|no> universal=<yes|no> skips=<yes|no> [min=N] [max=N]
#   token <name> <class>
#   message <key> <text>
# Each named record is unique. Class booleans are required by key; min/max are decimal counts.
#
# Class properties:
#   selects: contributes row selection.
#   standalone: can be a row's sole tag.
#   rowtag: can appear in a row tag field.
#   exclusive: cannot combine with another tag.
#   cli: can be the area argument.
#   universal: selects every area.
#   skips: permits the row to report exit 77.
#
# The runner also requires a combinable row tag and a unique cli=yes, rowtag=no default.
# A selecting row tag must represent an area, be universal, or be exclusive; otherwise
# it selects only the default run and silently disappears from scoped runs.
#
# The dump resolves defaults, emits every boolean in fixed order, and uses - for unbounded max.
# It also emits source, the resolved default token, and the ASCII whitespace set as hex codepoints.
# Whitespace includes newline, so it cannot travel as a literal field.
# Selection and skip behavior live in the runner; this file defines vocabulary and combinations.

# Arity counts fields after the kind word. It protects indexing before semantic checks.
# Keep class arity broad enough for the class validator to name missing or invalid properties.
# The kind declarations are validated inline while the arity table is being built.
kind kind    min=2
kind class   min=2
kind token   min=2 max=2
kind message min=2

class area       selects=yes standalone=yes rowtag=yes  exclusive=no  cli=yes universal=no  skips=no  min=1
class selector   selects=yes standalone=yes rowtag=yes  exclusive=no  cli=no  universal=yes skips=no  min=0
class modifier   selects=no  standalone=no  rowtag=yes  exclusive=no  cli=no  universal=no  skips=yes min=0
class exclusive  selects=yes standalone=yes rowtag=yes  exclusive=yes cli=no  universal=no  skips=no  min=1 max=1
class argument   selects=no  standalone=no  rowtag=no   exclusive=no  cli=yes universal=no  skips=no  min=1 max=1


token go         area
token qml        area
token helper     area
token packaging  area
token docs       area

# Universal checks must be cheap, network-free, and valid in a plain clone or worktree.
# A check that requires absent external generated files does not qualify.
token always     selector

# A skip modifier permits exit 77 but selects no area. It cannot stand alone.
token may-skip   modifier

# Exclusive rows run only in the default all-rows invocation.
token -          exclusive

# The all-rows CLI argument is not a row tag; using it as one would exclude scoped runs.
token all        argument

# Grammar diagnostics belong to the runner. Row diagnostics are shared with the manifest library.
# Tests derive expected messages from this table. Consumer-specific diagnostics stay in their consumer.

message row-no-separator    manifest row has no `AREAS | COMMAND` separator
message row-empty-tags      manifest row has an empty tag field
message row-malformed-tags  manifest row has a malformed tag field
message row-not-standalone  manifest row's only tag cannot stand alone
message row-no-selector     manifest row carries no selector
message row-empty-command   manifest row has an empty command
message row-bad-syntax      manifest row has invalid shell syntax
message grammar-bad-class   grammar token has an unknown class
message grammar-bad-kind    grammar has an unknown line kind
message grammar-duplicate   grammar declares the same record twice
message grammar-token-fields  grammar token line must be `token <name> <class>`
message grammar-class-malformed  grammar class property must be key=value
message grammar-class-value  grammar class property must be yes or no
message grammar-count-value  grammar min and max must be decimal integers
message grammar-default-count  grammar must declare exactly one CLI default token
message grammar-inert-selector  grammar row tag selects nothing in any named area
message grammar-class-missing  grammar class is missing a property
message grammar-repeated-field  grammar record repeats a field
message grammar-unknown-field  grammar record has an unknown field
message grammar-class-count  grammar declares the wrong number of tokens in a class
message grammar-token-name  grammar token name must be lowercase
message grammar-arity  grammar line has the wrong number of fields
