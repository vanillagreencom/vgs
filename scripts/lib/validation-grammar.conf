# THE VALIDATION MANIFEST GRAMMAR — the one definition, as DATA (VGS-123).
#
# Eight holes in this change came from one cause: the grammar existed as prose
# in a header plus several consumers that each RE-DERIVED it. Every reviewer
# found the next unstated rule. So the vocabulary and the rules live here, once,
# and scripts/validate, scripts/lib/validation_manifest.py and
# scripts/check-validation-inventory.py all READ this file rather than
# restating it. scripts/test-validate.sh GENERATES its must-fail controls from
# it, so adding a rule here produces the control that proves it.
#
# FORMAT: line-oriented, `kind` then fields, `#` comments, blank lines ignored.
# Chosen because bash reads it with `read` and python with `str.split()` — no
# `jq`, no `tomllib`, no eval of repo text, and no new dependency in either
# reader. JSON would need jq in the shell; TOML would need 3.11+; a sourceable
# .sh would put eval of file contents on the runner's start-up path.
#
#   class <name> selects=<yes|no> standalone=<yes|no> rowtag=<yes|no> exclusive=<yes|no>
#   token <name> <class>
#
# The class PROPERTIES are the rules, which is what makes them checkable and
# generatable rather than prose:
#
#   selects     the token decides WHEN a row runs. A row needs at least one.
#   standalone  the token may be a row's only tag.
#   rowtag      the token may appear in a row's tag field at all.
#   exclusive   the token may not be combined with any other tag.
#
# THE ONE RULE THAT IS NOT DATA, named rather than left implicit: what each
# token actually DOES at run time — that `always` selects every area, that
# `may-skip` permits exit 77 — is behaviour, and lives in scripts/validate's
# selection and run loops. This file says which tokens exist and how they may
# be combined; it cannot say what they mean. The wiring check in
# check-validation-inventory.py is what ties a declared token to real code.

class area       selects=yes standalone=yes rowtag=yes  exclusive=no
class selector   selects=yes standalone=yes rowtag=yes  exclusive=no
class modifier   selects=no  standalone=no  rowtag=yes  exclusive=no
class exclusive  selects=yes standalone=yes rowtag=yes  exclusive=yes
class argument   selects=no  standalone=no  rowtag=no   exclusive=no

# The areas. Each names a scope of the manifest and is usable as a row tag and
# as the command-line argument.
token go         area
token qml        area
token helper     area
token packaging  area
token docs       area

# Selects every area without being one. The bar is high and all three parts are
# load-bearing: cheap, network-free, and correct in ANY checkout — a plain
# clone, a CI-shaped checkout, a worktree made before `vstack refresh`. A check
# that hard-fails when some out-of-tree artifact is absent does not qualify
# however fast it is; the vendor-sync checks are exactly that, and are `-`.
token always     selector

# Permits exit 77, "precondition absent, nothing checked". Never selects, so a
# row carrying only this one would vanish from every named area while still
# running under `all`.
token may-skip   modifier

# Only the full `all` run selects this row. Exclusive: "only `all` runs this"
# cannot also be true of a row that names an area.
token -          exclusive

# The command-line argument for "every row". Never a row tag: as a tag it would
# match only an `all` run and behave like `-` everywhere else, which is the
# silent-narrowing shape this vocabulary exists to stop.
token all        argument

# ─── SHARED DIAGNOSTICS ─────────────────────────────────────────────────────
#
# Every message BOTH readers can emit, so neither spells it by hand. The
# lone-modifier text drifted twice and was hand-synchronised twice; discipline
# is precisely what failed, which is the same argument that produced this file
# one level up. Each reader looks the text up by key and adds its own context
# (the offending tags, the line); scripts/test-validation-inventory.sh asserts
# both readers' output against the text HERE, not against each other, so a
# third drift cannot pass by both sides moving together.
#
# Messages emitted by only ONE reader stay in that reader and are listed in its
# own comments — the split is deliberate, not accidental: the runner alone has
# usage and area-argument errors, and the library alone has the heredoc,
# empty-manifest, PyYAML, bash-launch, ci.yml, prose and table messages, none
# of which the runner ever computes.

message row-no-separator    manifest row has no `AREAS | COMMAND` separator
message row-empty-tags      manifest row has an empty tag field
message row-malformed-tags  manifest row has a malformed tag field
message row-not-standalone  manifest row's only tag cannot stand alone
message row-no-selector     manifest row carries no selector
message row-empty-command   manifest row has an empty command
message row-bad-syntax      manifest row has invalid shell syntax
message grammar-bad-class   grammar token has an unknown class
message grammar-bad-kind    grammar has an unknown line kind
message grammar-duplicate   grammar declares a token twice
