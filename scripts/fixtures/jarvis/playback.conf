# Private PipeWire 1.6 configuration from pipewire.conf(5), 2026-10-01.
# No device, session manager, real-time broker, pulse server or exec hook.
context.properties = {
    core.daemon = true
    core.name = jarvis-pcm
    support.dbus = false
    clock.power-of-two-quantum = false
    default.clock.rate = 24000
    default.clock.allowed-rates = [ 24000 ]
    default.clock.quantum = 240
    default.clock.min-quantum = 240
    default.clock.max-quantum = 240
    loop.rt-prio = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    audio.adapt = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-access }
]
context.objects = [
    { factory = spa-node-factory args = {
        factory.name = support.node.driver
        node.name = jarvis-driver
        node.group = jarvis-test
        priority.driver = 20000
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink
        node.name = fixture.speaker
        media.class = Audio/Sink
        node.group = jarvis-test
        node.always-process = true
        audio.rate = 24000
        audio.channels = 1
        audio.position = [ MONO ]
        adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
    } }
]
