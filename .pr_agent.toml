# Qodo Merge configuration for VGS (VanillaGreen Shell).
#
# Deliberately minimal. Qodo is on a 14-day trial here; if it lapses, deleting
# this file is the entire cleanup. Nothing else in the repo references Qodo:
# it publishes review objects (not a check-run or commit status), so it needs
# no gate wiring, and orch's PR_REVIEW_CHECK stays empty.
#
# CodeRabbit is the primary reviewer and carries the full rule set in
# .coderabbit.yaml. Only the rules that stop the most expensive misfires are
# duplicated here.

[github_app]
# Review only. /agentic_describe is omitted so Qodo posts no PR summary comment —
# CodeRabbit's summaries are off too, and two AI summaries of one diff is worse
# than none.
pr_commands = ["/agentic_review"]

[review_agent]
# Findings belong in threads next to the code, not in a summary block.
comments_location_policy = "inline"

issues_user_guidelines = """
This repo is a Quickshell 0.3.0 desktop shell (QML), a Go backend daemon, and a
large single-file Python helper CLI.

Quickshell is NOT plain Qt/QML. `Qt.quit()`/`Qt.exit()` do not end the process
(the signals have no receivers); `Qt.resolvedUrl()` yields a non-runnable
`qrc:/qs-blackhole/...` path — use `Quickshell.shellDir`; `Process` emits
`exited` before `running` goes false and emits nothing at all when the command
fails to start.

NEVER suggest running `qs -c vshell` or `qs -p quickshell/vshell` to validate a
change. That starts a second full shell in the live session, strands orphaned
full-screen layer surfaces, and blacks out the desktop. The sandboxed
`scripts/qml-smoke.sh --nested` is the supported runtime smoke. Never suggest
`pkill quickshell`; signal by pid or process group.

`backend/vendor/**`, the plugin directories under
`config/vshell/nvim/colorschemes/`, and `quickshell/vshell/assets/sounds/plasma/`
are byte-exact vendored upstream code. Report real defects there as upstream
issues to file — never as in-repo patches. `colorschemes/ATTRIBUTION.md` is VGS-authored and maintained here:
it maps each vendored dir to its upstream repo and license, so drift findings
on it are valid.

`scripts/**` is the test suite; there is no test framework. A check whose
failure path is unreachable is vacuous: watch for a suppressed exit status, an
empty result read as a clean result, and comparisons that pass when collection
failed.
"""

compliance_user_guidelines = """
`vstack.settings.toml` is public by design and committed deliberately; every
credential lives in gitignored `.env.local`. Do not report values in it as
leaked secrets, and do not ask for its options to be documented in README.md —
they are documented inline.

`[agent-frontmatter.*]` and `[agent-skills]` in `vstack.toml` are generated by
`vstack refresh` from upstream defaults. Findings about model, effort, or
sandbox-mode values there belong upstream; an in-repo edit is overwritten.

Doc surfaces are distinct and deliberately non-overlapping: the product-facing
set is exactly `README.md`, `packaging/README.md` (which owns per-channel
packaging detail) and `packaging/ubuntu/README.md`. `docs/architecture/**` are
agent reference docs, `AGENTS.md` and `project-skills/README.md` are agent
process instruction, and `AGENTS.local.md` is AGENTS.md's machine-local
companion — untracked by design, so a PR never contains it. Do not request
cross-posting between them.

A README inside a vendored tree is not automatically vendored.
`third_party/coderabbit-schema/README.md` and `third_party/asdcontrol/README.md`
are VGS-authored maintenance docs — why the artifact is pinned, how to refresh
it, what shipping it obliges — so drift findings on those two are valid.
Pinned beside them are the artifacts themselves (`schema.v2.json`,
`asdcontrol.cpp`), by the convention those READMEs record rather than by any
check, and the `third_party/review-gate/` and `third_party/size-ratchet/`
engine trees, which local validation — not CI — diffs whole against the
vstack-managed copy.

Every backend method must map to a documented capability in
`docs/architecture/backend-methods.json`; QML gates on advertised capabilities,
never on raw `apiVersion` ordinals. One owner per resource — reject a second
watcher or poller for something the helper or QML already owns.
"""
