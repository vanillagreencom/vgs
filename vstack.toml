# ─────────────────────────────────────────────────────
# vstack.toml — project-level agent customization
#
# Customize agent behavior for this project. These
# settings are merged into generated agent files on
# every install and refresh.
#
# Skills live in [agent-skills]. Generated frontmatter
# overrides like model, effort, deny-tools, color, pane,
# and Claude background/isolation/memory live in
# harness-specific [agent-frontmatter.<harness>] tables.
#
# After editing, run:  vstack refresh
# ─────────────────────────────────────────────────────


# ── Launch Instructions ───────────────────────────────
# Adds a "## Launch Instructions" section near the top
# of each agent file. Use this for startup tasks, required
# reading, or project-specific operating notes.
# Examples:
# rust = "Read docs/architecture.md before coding."
# iced = """
# Read docs/ui.md.
# Update docs when UI architecture changes.
# """
#
[agent-launch-instructions]

generalist = ""

planner = ""

researcher = ""

reviewer-arch = ""

reviewer-correctness = ""

reviewer-doc = ""

reviewer-error = ""

reviewer-perf = ""

reviewer-quality = ""

reviewer-safety = ""

reviewer-security = ""

reviewer-structure = ""

reviewer-test = ""

scout = ""


# ── Additional Instructions ──────────────────────────
# Adds a "## Additional Instructions" section at the
# bottom of each agent file. Project-specific rules,
# conventions, or reminders for this agent.
#
[agent-additional-instructions]

generalist = ""

planner = ""

researcher = ""

reviewer-arch = ""

reviewer-correctness = ""

reviewer-doc = ""

reviewer-error = ""

reviewer-perf = ""

reviewer-quality = ""

reviewer-safety = ""

reviewer-security = ""

reviewer-structure = ""

reviewer-test = ""

scout = ""


# ── Skill Instructions ────────────────────────────────
# Adds a "## Project Instructions" section at the
# top of each skill's SKILL.md. Project-specific
# context for how this skill applies to your codebase.
# Won't overwrite the skill author's own instructions.
#
[skill-instructions]

decider = ""

deep-research = ""

dev = ""

github = ""

linear = ""

orch = ""

project-management = ""

reviewer = ""

second-opinion = ""

worktree = ""


# ── Agent Skills ─────────────────────────────────────
# Skills attached to each agent's frontmatter.
# This is the single source of truth — add or remove
# skills here and run `vstack refresh` to apply.
#
# Populated automatically at install time from source
# mappings. You can freely add your own skills to any
# agent's list (they don't need to be in the vstack
# repo — local skill directories work too).
#
[agent-skills]

generalist = [
    "decider",
    "dev",
    "github",
    "linear",
]

planner = [
    "github",
    "linear",
]

researcher = [
    "decider",
    "deep-research",
    "github",
    "linear",
]

reviewer-arch = [
    "reviewer",
]

reviewer-correctness = [
    "reviewer",
]

reviewer-doc = [
    "reviewer",
]

reviewer-error = [
    "reviewer",
]

reviewer-perf = [
    "reviewer",
]

reviewer-quality = [
    "reviewer",
]

reviewer-safety = [
    "reviewer",
]

reviewer-security = [
    "reviewer",
]

reviewer-structure = [
    "reviewer",
]

reviewer-test = [
    "reviewer",
]

scout = [
    "github",
    "linear",
]

# ── Agent Frontmatter ────────────────────────────────
# vstack writes active defaults here for every installed agent.
# Edit fields, then run `vstack refresh` to regenerate harness files.
# Harness-specific entries apply only to that harness.
# Fields: color, model, effort, deny-tools, allowed-subagents,
# pane, background, isolation, memory, mode, sandbox-mode,
# model-reasoning-effort, nickname-candidates.
# Claude background is seeded from Pi pane on first install (pane=true -> false, pane=false -> true), then preserved on refresh.
# Pi allowed-subagents is the restricted delegation allowlist for delegate_subagent (engineer default ['scout']; set [] to disable).
# OpenCode maps colors to hex. Effort values are written verbatim per harness.
#
[agent-frontmatter.claude]
generalist = { color = "green", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = false }

planner = { color = "blue", model = "inherit", effort = "max", deny-tools = ["Agent"], background = false }

researcher = { color = "purple", model = "inherit", effort = "max", deny-tools = ["Agent", "AskUserQuestion"], background = true }

reviewer-arch = { color = "yellow", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = true }

reviewer-correctness = { color = "red", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = true }

reviewer-doc = { color = "yellow", model = "inherit", effort = "medium", deny-tools = ["Agent", "AskUserQuestion"], background = true }

reviewer-error = { color = "orange", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = true }

reviewer-perf = { color = "red", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = true }

reviewer-quality = { color = "purple", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = true }

reviewer-safety = { color = "red", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = true }

reviewer-security = { color = "red", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = true }

reviewer-structure = { color = "cyan", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = true }

reviewer-test = { color = "blue", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = true }

scout = { color = "cyan", model = "sonnet", effort = "high", deny-tools = ["Agent", "AskUserQuestion"], background = true }

